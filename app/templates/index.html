<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123f34">
    <meta name="description" content="A fast, friendly multiplayer card game for your group.">
    <title>Color Club — Party Card Game</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" id="brand-home" aria-label="Color Club home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-copy"><strong>COLOR CLUB</strong><small>PARTY CARD GAME</small></span>
      </button>
      <div class="topbar-right">
        <span class="connection" id="connection" hidden><i></i><span>Connecting</span></span>
        <span class="no-accounts">2–8 players <b>·</b> no accounts</span>
      </div>
    </header>
    <main id="app" class="app-shell" aria-live="polite" aria-busy="false"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <noscript><p class="noscript">Color Club needs JavaScript enabled to sync the game.</p></noscript>
  </body>
</html>
